<!doctype html>
<meta charset="utf-8">
<title>Redirecting…</title>
<script>
  // For GH Pages: if someone lands on /b/<id> without hash, send them to the hash route
  (function(){
    var path = location.pathname.replace(/\/+$/,''); // no trailing slash
    if(!location.hash){
      // Convert /b/<id> to #/b/<id>
      var frag = path.replace(/^.*?\/(?=b\/|found\/)/,''); // keep from /b or /found onward if present
      if(!frag) frag = '';
      location.replace((location.origin + location.pathname).replace(/404\.html$/,'') + '#/' + frag);
    }
  })();
</script>
<p>Redirecting… If nothing happens, <a href="#/">go home</a>.</p>
